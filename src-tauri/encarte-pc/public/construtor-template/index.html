<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <title>Construtor de Template de Encarte · Somado</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* tema no jeito do Adobe Spectrum (dark): cinza neutro, azul de destaque, Source Sans 3 */
    :root {
      --c-bg: #1b1b1b; --c-panel: #252525; --c-panel2: #2e2e2e;
      --c-accent: #378ef0; --c-accent2: #2c2c2c;
      --c-text: #e8e8e8; --c-text2: #9d9d9d; --c-border: #3a3a3a;
      --c-campo: #1b1b1b; --c-campo-borda: #4a4a4a;
      --c-canvas: #161616; --c-sel: #378ef055;
      --panel-w: 228px; --prop-w: 288px;
    }
    body { display: flex; flex-direction: column; height: 100vh; font: 13px/1.4 'Source Sans 3', 'Adobe Clean', system-ui, sans-serif; color: var(--c-text); background: var(--c-bg); overflow: hidden; }

    /* ── toolbar ─────────────────────────────────────────────────────── */
    #toolbar {
      height: 44px; background: var(--c-panel); border-bottom: 1px solid var(--c-border);
      display: flex; align-items: center; gap: 4px; padding: 0 12px; flex-shrink: 0;
    }
    #toolbar .sep { width: 1px; height: 24px; background: var(--c-border); margin: 0 4px; }
    #toolbar .title { font-weight: 600; margin-right: 8px; color: var(--c-accent); }
    #toolbar .proj-name { font-size: 12px; color: var(--c-text2); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn {
      padding: 4px 10px; border-radius: 5px; border: 1px solid var(--c-border); background: transparent;
      color: var(--c-text); cursor: pointer; font-size: 12px; white-space: nowrap;
    }
    .btn:hover { background: var(--c-border); }
    .btn.primary { background: var(--c-accent); border-color: var(--c-accent); color: #fff; }
    .btn.primary:hover { filter: brightness(1.15); }
    .btn.active { background: var(--c-accent2); border-color: var(--c-accent2); }

    /* ── main ────────────────────────────────────────────────────────── */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* ── sidebar esquerda ────────────────────────────────────────────── */
    #sidebar { width: var(--panel-w); background: var(--c-panel); border-right: 1px solid var(--c-border); display: flex; flex-direction: column; overflow: hidden; }
    .sb-section { border-bottom: 1px solid var(--c-border); }
    .sb-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 10px; font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .06em; color: var(--c-text2); cursor: pointer;
    }
    .sb-header button { background: none; border: none; color: var(--c-text2); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; }
    .sb-header button:hover { color: var(--c-text); }
    .sb-list { max-height: 200px; overflow-y: auto; }
    .sb-item {
      display: flex; align-items: center; gap: 6px; padding: 5px 10px; cursor: pointer;
      font-size: 12px; border-left: 2px solid transparent;
    }
    .sb-item:hover { background: var(--c-panel2); }
    .sb-item.active { border-left-color: var(--c-accent); color: var(--c-accent); }
    .sb-item .del { margin-left: auto; opacity: 0; font-size: 14px; color: var(--c-text2); }
    .sb-item:hover .del { opacity: 1; }
    .sb-item .del:hover { color: var(--c-accent); }
    #sb-tools { padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    #sb-tools .btn { text-align: center; padding: 6px; font-size: 11px; }

    /* ── canvas ──────────────────────────────────────────────────────── */
    #canvas-wrap { flex: 1; background: var(--c-canvas); overflow: auto; display: flex; align-items: flex-start; padding: 24px; }
    /* margin:auto centraliza quando cabe e deixa rolar até a borda quando o zoom passa da tela */
    #canvas-outer { position: relative; margin: 0 auto; flex-shrink: 0; }
    #btn-zoom { min-width: 56px; font-variant-numeric: tabular-nums; }
    #canvas-svg { display: block; cursor: default; }
    #canvas-svg.mode-texto, #canvas-svg.mode-retangulo, #canvas-svg.mode-imagem, #canvas-svg.mode-zona { cursor: crosshair; }

    /* alças de resize */
    .handle { fill: #fff; stroke: var(--c-accent); stroke-width: 1.5; cursor: default; }
    .handle.nw, .handle.se { cursor: nwse-resize; }
    .handle.ne, .handle.sw { cursor: nesw-resize; }
    .handle.n, .handle.s { cursor: ns-resize; }
    .handle.e, .handle.w { cursor: ew-resize; }
    .sel-rect { fill: none; stroke: var(--c-accent); stroke-width: 1.5; stroke-dasharray: 4 3; pointer-events: none; }

    /* ── painel direito ──────────────────────────────────────────────── */
    #props { width: var(--prop-w); background: var(--c-panel); border-left: 1px solid var(--c-border); overflow-y: auto; }
    .prop-section { padding: 10px; border-bottom: 1px solid var(--c-border); }
    .prop-section h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--c-text2); margin-bottom: 8px; }
    .prop-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .prop-row label { font-size: 11px; color: var(--c-text2); width: 70px; flex-shrink: 0; }
    .prop-row input, .prop-row select, .prop-row textarea {
      flex: 1; background: var(--c-campo); border: 1px solid var(--c-border); color: var(--c-text);
      border-radius: 4px; padding: 3px 6px; font-size: 12px; font-family: inherit;
    }
    .prop-row input[type=color] { height: 28px; padding: 2px; cursor: pointer; }
    .prop-row input[type=number] { width: 60px; flex: none; }
    .prop-row input:focus, .prop-row select:focus { outline: none; border-color: var(--c-accent); }
    #props-vazio { padding: 16px; color: var(--c-text2); font-size: 12px; text-align: center; }

    /* ── modal card model ────────────────────────────────────────────── */
    #modal-overlay { display: none; position: fixed; inset: 0; background: #0008; z-index: 100; align-items: center; justify-content: center; }
    #modal-overlay.open { display: flex; }
    #modal {
      background: var(--c-panel); border: 1px solid var(--c-border); border-radius: 8px;
      width: 820px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden;
    }
    #modal-header { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--c-border); gap: 10px; }
    #modal-header h2 { font-size: 14px; flex: 1; }
    #modal-body { display: flex; flex: 1; overflow: hidden; }
    #modal-canvas-wrap { flex: 1; background: var(--c-canvas); display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
    #modal-canvas { border: 1px solid var(--c-border); display: block; }
    #modal-props { width: 260px; border-left: 1px solid var(--c-border); overflow-y: auto; padding: 10px; }
    #modal-footer { padding: 10px 16px; border-top: 1px solid var(--c-border); display: flex; justify-content: flex-end; gap: 8px; }

    .campo-item {
      border: 1px solid var(--c-border); border-radius: 4px; padding: 6px 8px; margin-bottom: 6px;
      cursor: pointer;
    }
    .campo-item:hover { border-color: var(--c-accent2); }
    .campo-item.active { border-color: var(--c-accent); }
    .campo-item-header { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; }
    .campo-color { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }

    /* ── projeto modal ───────────────────────────────────────────────── */
    #proj-modal {
      display: none; position: fixed; inset: 0; background: #0008; z-index: 200;
      align-items: center; justify-content: center;
    }
    #proj-modal.open { display: flex; }
    #proj-form {
      background: var(--c-panel); border: 1px solid var(--c-border); border-radius: 8px;
      padding: 20px; width: 400px;
    }
    #proj-form h2 { font-size: 14px; margin-bottom: 14px; }
    #proj-form .prop-row label { width: 90px; }

    /* loading */
    #loading { position: fixed; inset: 0; background: #0008; z-index: 300; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; }
    #loading.hidden { display: none; }

    /* ── Spectrum: controles ─────────────────────────────────────────── */
    #toolbar { height: 48px; background: var(--c-panel); border-bottom: 1px solid #111; gap: 2px; }
    #toolbar .title { color: var(--c-text); font-weight: 700; letter-spacing: .02em; }
    .btn { height: 28px; padding: 0 12px; border-radius: 4px; border: 1px solid transparent; background: transparent; color: var(--c-text); font: 600 12px 'Source Sans 3', system-ui, sans-serif; transition: background .12s; }
    .btn:hover { background: #ffffff14; }
    .btn:active { background: #ffffff1f; }
    .btn.active { background: #ffffff1f; color: #fff; box-shadow: inset 0 -2px 0 var(--c-accent); }
    .btn.primary { background: var(--c-accent); border-color: var(--c-accent); color: #fff; border-radius: 14px; padding: 0 16px; }
    .btn.primary:hover { filter: brightness(1.1); background: var(--c-accent); }
    #sidebar, #props { background: var(--c-panel); }
    #sidebar { border-right: 1px solid #111; } #props { border-left: 1px solid #111; }
    .sb-section { border-bottom: 1px solid #111; }
    .sb-header { font-size: 11px; letter-spacing: .04em; color: var(--c-text2); padding: 10px 12px 6px; }
    .sb-item { padding: 6px 12px; border-radius: 4px; margin: 0 6px; border-left: 0; }
    .sb-item:hover { background: #ffffff0f; }
    .sb-item.active { background: #ffffff1a; color: #fff; }
    .prop-section { padding: 10px 12px 6px; border-bottom: 1px solid #111; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 10px; }
    .prop-row > * { min-width: 0; } .prop-row input, .prop-row select, .prop-row textarea { min-width: 0; }
    #props { overflow-x: hidden; }
    .prop-section > * { grid-column: 1 / -1; }
    .prop-section > .meia { grid-column: auto; }
    .prop-section h3 { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--c-text); margin-bottom: 8px; text-transform: none; }
    .prop-row { gap: 8px; margin-bottom: 6px; min-height: 26px; }
    .prop-row label { font-size: 12px; color: var(--c-text2); width: 76px; }
    .prop-row.meia label { width: auto; min-width: 18px; }
    .prop-row.ic label { width: 18px; display: flex; align-items: center; justify-content: center; }
    .prop-row.ic label svg { width: 16px; height: 16px; }
    .prop-row input, .prop-row select, .prop-row textarea, .pc-hex, .pg-num, .pg-sel {
      background: var(--c-campo); border: 1px solid var(--c-campo-borda); border-radius: 4px; color: var(--c-text);
      height: 26px; padding: 0 8px; font: 13px 'Source Sans 3', system-ui, sans-serif; }
    .prop-row textarea { height: auto; padding: 4px 8px; }
    .prop-row input[type=number] { width: auto; flex: 1; min-width: 0; font-variant-numeric: tabular-nums; }
    .prop-row input:hover, .prop-row select:hover { border-color: #6a6a6a; }
    .prop-row input:focus, .prop-row select:focus, .prop-row textarea:focus { outline: none; border-color: var(--c-accent); box-shadow: 0 0 0 1px var(--c-accent); }
    input[type=checkbox] { accent-color: var(--c-accent); width: 14px; height: 14px; }
    .cor-btn { height: 26px; background: var(--c-campo); border-color: var(--c-campo-borda); border-radius: 4px; }
    .campo-item { border: 0; border-radius: 4px; padding: 5px 8px; margin-bottom: 2px; }
    .campo-item:hover { background: #ffffff0f; }
    .campo-item.active { background: #378ef026; box-shadow: inset 2px 0 0 var(--c-accent); }
    #modal { background: var(--c-panel); border: 1px solid #111; border-radius: 8px; box-shadow: 0 20px 60px #000a; }
    #modal-header { border-bottom: 1px solid #111; } #modal-props { border-left: 1px solid #111; }
    #modal-props { width: 300px; overflow-x: hidden; }
    #proj-form, #abrir-modal > div { background: var(--c-panel) !important; border-color: #111 !important; }
    ::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 5px; border: 2px solid var(--c-panel); } ::-webkit-scrollbar-track { background: transparent; }
    /* barra de ícones + painéis */
    #rail { width: 44px; flex-shrink: 0; background: var(--c-panel); border-right: 1px solid #111; display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 2px; }
    .rail-btn { width: 34px; height: 34px; border: 0; border-radius: 4px; background: none; color: #c8c8c8; display: grid; place-items: center; cursor: pointer; }
    .rail-btn svg { width: 20px; height: 20px; }
    .rail-btn:hover { background: #ffffff14; color: #fff; }
    .rail-btn.active { background: #ffffff24; color: #fff; }
    .rail-btn.aberto { color: var(--c-accent); }
    .rail-sep { width: 24px; height: 1px; background: #3a3a3a; margin: 6px 0; }
    #sidebar { display: none; }
    #sidebar.aberto { display: flex; }
    #sidebar .sb-section { display: none; }
    #sidebar .sb-section.aberto { display: block; }
    #sidebar .sb-list { max-height: none; }
    #props-alca { display: none; }

    /* ── embutido no editor de encarte (embutido.js): só o editor do modelo, em tela cheia ── */
    body.embutido #toolbar, body.embutido #main { display: none; }
    body.embutido #modal-overlay.open { background: var(--c-bg); }
    body.embutido #modal { width: 100vw; height: 100vh; height: 100dvh; max-height: none; border: 0; border-radius: 0; box-shadow: none; }
    body.embutido #modal-header { flex-wrap: wrap; row-gap: 6px; }
    body.embutido #modal-header .btn:disabled { opacity: .5; cursor: default; }
    /* ?painel: só as ferramentas, ao lado do encarte (o card é o de lá) */
    body.embutido.painel #modal-canvas-wrap { display: none; }
    body.embutido.painel #modal-body { flex-direction: column; }
    body.embutido.painel #modal-props { width: 100%; max-width: none; flex: 1; border-left: 0; }
    #emb-aviso { padding: 8px 16px; background: #4d3a00; color: #ffd76a; font-size: 12px; border-bottom: 1px solid #111; }
    #emb-aviso.oculto { display: none; }

    /* ── celular ─────────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      body { height: 100dvh; }
      #toolbar { padding: 0 6px; overflow-x: auto; overflow-y: hidden; }
      #toolbar .title { display: none; }
      #toolbar .proj-name { max-width: 90px; }
      #toolbar .btn { padding: 0 8px; height: 34px; }
      #main { position: relative; }
      #rail { width: 48px; }
      .rail-btn { width: 40px; height: 40px; }
      /* painéis da barra de ícones abrem por cima da tela */
      #sidebar.aberto { position: absolute; left: 48px; top: 0; bottom: 0; z-index: 50; width: min(260px, 75vw); box-shadow: 8px 0 24px #0008; }
      .sb-item { padding: 10px 12px; }
      .sb-item .del { opacity: 1; font-size: 18px; padding: 0 4px; }
      #canvas-wrap { padding: 12px 12px 56px; touch-action: none; }
      /* propriedades viram uma gaveta presa embaixo */
      #props { position: fixed; left: 0; right: 0; bottom: 0; width: auto; z-index: 60; max-height: 44px; overflow: hidden; border-left: 0; border-top: 1px solid #111; box-shadow: 0 -8px 24px #0008; transition: max-height .2s; }
      #props.aberto { max-height: 55dvh; overflow-y: auto; }
      #props-alca { display: flex; align-items: center; justify-content: center; gap: 6px; position: sticky; top: 0; z-index: 1; width: 100%; height: 44px; background: var(--c-panel); border: 0; border-bottom: 1px solid #111; color: var(--c-text); font: 600 13px 'Source Sans 3', system-ui, sans-serif; }
      #props-alca::after { content: '▲'; font-size: 10px; color: var(--c-text2); }
      #props.aberto #props-alca::after { content: '▼'; }
      .prop-row input, .prop-row select, .prop-row textarea, .cor-btn { height: 34px; font-size: 16px; }
      .car-campo input, .car-linha select { height: 34px !important; font-size: 16px !important; }
      .car-tog { height: 34px !important; }
      /* janelas em tela cheia */
      #modal { width: 100vw; max-height: 100dvh; height: 100dvh; border-radius: 0; }
      #modal-body { flex-direction: column; overflow-y: auto; }
      #modal-canvas-wrap { flex: none; height: 42dvh; touch-action: none; }
      #modal-props { width: auto !important; border-left: 0 !important; border-top: 1px solid #111; overflow: visible; }
      #proj-form, #abrir-modal > div { width: 92vw !important; }
    }
  </style>
</head>
<body>

<!-- Toolbar -->
<div id="toolbar">
  <a class="title" href="/" title="Voltar pro Somado Tarefas" style="text-decoration:none">‹ Construtor</a>
  <span class="proj-name" id="proj-nome-label">Nenhum projeto</span>
  <div class="sep"></div>
  <button class="btn" id="btn-novo-proj">Novo</button>
  <button class="btn" id="btn-abrir-proj">Abrir</button>
  <button class="btn" id="btn-salvar">Salvar</button>
  <button class="btn" id="btn-duplicar-proj" title="Duplicar este projeto (outro cliente ou outro tema)">Duplicar</button>
  <div style="flex:1"></div>
  <button class="btn" id="btn-desfazer" title="Desfazer (Ctrl+Z)">↶</button>
  <button class="btn" id="btn-refazer" title="Refazer (Ctrl+Y)">↷</button>
  <div class="sep"></div>
  <button class="btn" id="btn-zoom-menos" title="Diminuir zoom (roda do mouse ou Ctrl −; espaço + arrastar move a vista)">−</button>
  <button class="btn" id="btn-zoom" title="Caber na tela (Ctrl 0)">100%</button>
  <button class="btn" id="btn-zoom-mais" title="Aumentar zoom (Ctrl +)">+</button>
  <div class="sep"></div>
  <button class="btn primary" id="btn-publicar">↑ Publicar</button>
</div>

<!-- Main -->
<div id="main">

  <!-- Barra de ferramentas (ícones, como a do Photoshop) -->
  <div id="rail">
    <button class="rail-btn active" data-tool="selecionar" title="Selecionar e mover (V)">
      <svg viewBox="0 0 20 20"><path d="M5 2.5v13.2l3.4-3.3 2.3 5.1 2.1-.9-2.3-5h4.7z" fill="currentColor"/></svg></button>
    <button class="rail-btn" data-tool="texto" title="Texto (T)">
      <svg viewBox="0 0 20 20"><path d="M4 4h12v3h-1.6l-.4-1.4h-3.1V15l1.6.4V17H7.5v-1.6l1.6-.4V5.6H6L5.6 7H4z" fill="currentColor"/></svg></button>
    <button class="rail-btn" data-tool="retangulo" title="Forma (R)">
      <svg viewBox="0 0 20 20"><rect x="3.5" y="5" width="13" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
    <button class="rail-btn" data-tool="imagem" title="Imagem (I)">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="14" height="12" rx="1.5"/><circle cx="7.5" cy="8.3" r="1.4"/><path d="m4 15 4.2-4.2 2.6 2.6 2-2L16.5 15"/></svg></button>
    <button class="rail-btn" data-tool="zona" title="Zona da grade (Z)">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="6" height="6" rx=".8"/><rect x="11" y="3" width="6" height="6" rx=".8"/><rect x="3" y="11" width="6" height="6" rx=".8"/><rect x="11" y="11" width="6" height="6" rx=".8"/></svg></button>
    <div class="rail-sep"></div>
    <button class="rail-btn" data-painel="pranchetas" title="Pranchetas">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="2.5" width="10" height="13" rx="1"/><path d="M3 5.5v11h9"/></svg></button>
    <button class="rail-btn" data-painel="modelos" title="Modelos de card">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="3" width="12" height="14" rx="1.5"/><path d="M6.5 12.5h7v2.5h-7zM6.5 6h7"/></svg></button>
  </div>

  <!-- Painéis (abrem pelos ícones da barra) -->
  <div id="sidebar">
    <div class="sb-section" id="painel-pranchetas">
      <div class="sb-header">
        Pranchetas
        <button id="btn-nova-prancheta" title="Nova prancheta">+</button>
      </div>
      <div class="sb-list" id="lista-pranchetas"></div>
    </div>
    <div class="sb-section" id="painel-modelos">
      <div class="sb-header">
        Modelos de Card
        <span>
          <button id="btn-colar-modelo" title="Colar modelo copiado" style="display:none;font-size:12px">Colar</button>
          <button id="btn-novo-modelo" title="Novo modelo de card">+</button>
        </span>
      </div>
      <div class="sb-list" id="lista-modelos"></div>
    </div>
  </div>

  <!-- Canvas -->
  <div id="canvas-wrap">
    <div id="canvas-outer">
      <svg id="canvas-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <!-- Painel de propriedades -->
  <div id="props">
    <button type="button" id="props-alca">Propriedades</button>
    <div id="props-vazio">Selecione um elemento para editar suas propriedades</div>
    <div id="props-conteudo" style="display:none"></div>
  </div>
</div>

<!-- Modal Card Model -->
<div id="modal-overlay">
  <div id="modal">
    <div id="modal-header">
      <h2>Editar modelo de card</h2>
      <button class="btn" id="modal-desfazer" title="Desfazer (Ctrl+Z)">↶</button>
      <button class="btn" id="modal-refazer" title="Refazer (Ctrl+Y)">↷</button>
      <button class="btn" id="modal-cancelar">Cancelar</button>
      <button class="btn primary" id="modal-salvar">Salvar</button>
    </div>
    <div id="modal-body">
      <div id="modal-canvas-wrap">
        <canvas id="modal-canvas" width="200" height="280"></canvas>
      </div>
      <div id="modal-props">
        <div style="margin-bottom:8px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--c-text2);">Campos do Card</div>
        <div id="modal-campos-lista"></div>
        <button class="btn" id="modal-add-campo" style="width:100%; margin-top:6px;">+ Adicionar campo</button>
        <div id="modal-campo-props" style="margin-top:12px; display:none;"></div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Novo/Editar Projeto -->
<div id="proj-modal">
  <div id="proj-form">
    <h2 id="proj-form-titulo">Novo Projeto</h2>
    <div class="prop-row"><label>Nome</label><input id="pf-nome" placeholder="Terça da Feira" /></div>
    <div class="prop-row"><label>Cliente</label><input id="pf-cliente" placeholder="rodrigues (slug da pasta)" /></div>
    <div class="prop-row"><label>Tema</label><input id="pf-tema" placeholder="terca-feira" /></div>
    <div class="prop-row"><label>Largura (px)</label><input id="pf-w" type="number" value="800" /></div>
    <div class="prop-row"><label>Altura (px)</label><input id="pf-h" type="number" value="1200" /></div>
    <div class="prop-row"><label>Espaço (pt)</label><input id="pf-espaco" type="number" value="4" /></div>
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:14px;">
      <button class="btn" id="pf-cancelar">Cancelar</button>
      <button class="btn primary" id="pf-criar">Criar</button>
    </div>
  </div>
</div>

<!-- Modal Abrir Projeto -->
<div id="abrir-modal" style="display:none; position:fixed; inset:0; background:#0008; z-index:200; align-items:center; justify-content:center;">
  <div style="background:var(--c-panel); border:1px solid var(--c-border); border-radius:8px; padding:20px; width:500px; max-height:80vh; display:flex; flex-direction:column; gap:10px;">
    <h2 style="font-size:14px;">Abrir projeto</h2>
    <div id="abrir-lista" style="flex:1; overflow-y:auto; border:1px solid var(--c-border); border-radius:4px; max-height:400px;"></div>
    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <button class="btn" id="abrir-cancelar">Cancelar</button>
    </div>
  </div>
</div>

<div id="loading" class="hidden">Carregando…</div>

<script src="../encarte/divisorias.js"></script>
<script src="app.js"></script>
<script src="biblioteca.js"></script>
<script src="embutido.js"></script>
</body>
</html>
