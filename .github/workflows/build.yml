name: Instalador Windows

# Push na main: compila e guarda o instalador como artefato (pra testar).
# Tag v*: compila, assina e publica a Release com o latest.json que o
# programa instalado consulta pra se atualizar sozinho.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Compilar e publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Somado Tarefas ${{ github.ref_name }}"
          releaseBody: "Instalador do Windows. Quem já tem instalado recebe sozinho."
          releaseDraft: false
          updaterJsonPreferNsis: true

      - name: Compilar (teste)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        shell: bash
        # Sem a chave no repo ainda, compila sem os arquivos de atualização.
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then npx tauri build
          else npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'; fi

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: instalador
          path: src-tauri/target/release/bundle/nsis/*.exe
